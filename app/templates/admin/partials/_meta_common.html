<div class="editor-grid common-meta-section">
  <div class="editor-row">
    <label for="common_title">Common Title</label>
    <input id="common_title" type="text" placeholder="Shared title" />
  </div>
  <div class="editor-row">
    <label for="common_description">Common Description</label>
    <textarea
      id="common_description"
      rows="3"
      placeholder="Shared description"
    ></textarea>
  </div>
  <div class="editor-row">
    <label for="common_social_links">Header Social Links</label>
    <textarea
      id="common_social_links"
      rows="3"
      placeholder="Instagram | https://example.com/profile"
    ></textarea>
  </div>
</div>
