<div class="editor-grid">
  <div class="editor-row">
    <label for="jsonld_context">Context</label>
    <input id="jsonld_context" type="text" placeholder="https://schema.org" />
  </div>
  <div class="editor-row">
    <label for="jsonld_type">Type</label>
    <input id="jsonld_type" type="text" placeholder="Person" />
  </div>
  <div class="editor-row">
    <label for="jsonld_name">Name</label>
    <input id="jsonld_name" type="text" placeholder="Schema name" />
  </div>
  <div class="editor-row">
    <label for="jsonld_description">Description</label>
    <textarea
      id="jsonld_description"
      rows="3"
      placeholder="Schema description"
    ></textarea>
  </div>
  <div class="editor-row">
    <label for="jsonld_image">Image</label>
    <input id="jsonld_image" type="text" placeholder="images/example.jpg" />
  </div>
  <div class="editor-row">
    <label for="jsonld_same_as">Same As</label>
    <textarea
      id="jsonld_same_as"
      rows="4"
      placeholder="One URL per line"
    ></textarea>
  </div>
</div>
