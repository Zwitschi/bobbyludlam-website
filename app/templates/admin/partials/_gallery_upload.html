<h2>Upload Image</h2>
<div class="image-upload-form">
  <input type="file" id="gallery_upload_input" accept="image/*" />
  <label for="gallery_upload_input" class="image-upload-label">Upload Image</label>
  <input id="gallery_upload_caption" type="text" placeholder="Caption" />
  <span id="upload_status"></span>
</div>
