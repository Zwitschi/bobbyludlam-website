<div class="editor-grid">
  <div class="editor-row">
    <label for="og_title">OG Title</label>
    <input id="og_title" type="text" placeholder="Open Graph title" />
  </div>
  <div class="editor-row">
    <label for="og_description">OG Description</label>
    <textarea
      id="og_description"
      rows="3"
      placeholder="Open Graph description"
    ></textarea>
  </div>
  <div class="editor-row">
    <label for="og_type">OG Type</label>
    <input id="og_type" type="text" placeholder="website" />
  </div>
  <div class="editor-row">
    <label for="og_site_name">OG Site Name</label>
    <input id="og_site_name" type="text" placeholder="Site name" />
  </div>
  <div class="editor-row">
    <label for="og_image">OG Image</label>
    <input id="og_image" type="text" placeholder="images/example.jpg" />
  </div>
</div>
