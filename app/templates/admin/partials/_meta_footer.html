<div class="editor-grid">
  <div class="editor-row">
    <label for="footer_summary">Summary</label>
    <textarea
      id="footer_summary"
      rows="2"
      placeholder="Footer summary"
    ></textarea>
  </div>
  <div class="editor-row">
    <label for="footer_links">Footer Links</label>
    <textarea
      id="footer_links"
      rows="4"
      placeholder="Label | https://example.com"
    ></textarea>
  </div>
  <div class="editor-row">
    <label for="footer_copyright_year">Copyright Year</label>
    <input id="footer_copyright_year" type="number" placeholder="2026" />
  </div>
  <div class="editor-row">
    <label for="footer_credit_label">Credit Label</label>
    <input id="footer_credit_label" type="text" placeholder="Credit label" />
  </div>
  <div class="editor-row">
    <label for="footer_credit_url">Credit URL</label>
    <input
      id="footer_credit_url"
      type="text"
      placeholder="https://example.com"
    />
  </div>
  <div class="editor-row">
    <label for="footer_credit_text">Credit Text</label>
    <textarea
      id="footer_credit_text"
      rows="2"
      placeholder="Credit text"
    ></textarea>
  </div>
</div>
