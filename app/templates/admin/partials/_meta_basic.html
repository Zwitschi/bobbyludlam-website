<div class="editor-grid">
  <div class="editor-row">
    <label for="meta_title">Page Title</label>
    <input id="meta_title" type="text" placeholder="Page title" />
  </div>
  <div class="editor-row">
    <label for="meta_description">Meta Description</label>
    <textarea
      id="meta_description"
      rows="3"
      placeholder="Meta description"
    ></textarea>
  </div>
  <div class="editor-row">
    <label for="meta_keywords">Keywords (one per line)</label>
    <textarea
      id="meta_keywords"
      rows="4"
      placeholder="One keyword per line"
    ></textarea>
  </div>
</div>
